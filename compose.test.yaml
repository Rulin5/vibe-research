name: vibe-research-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibe_research_test
      POSTGRES_USER: vibe_test
      POSTGRES_PASSWORD: vibe_test_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_test -d vibe_research_test"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_test_data:
