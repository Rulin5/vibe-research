limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;

upstream vibe_api {
    server api:8900;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 36m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/auth/login {
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass http://vibe_api;
        include /etc/nginx/proxy_params;
    }

    location = /api/auth/register {
        limit_req zone=auth_strict burst=3 nodelay;
        proxy_pass http://vibe_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://vibe_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location = /api/metrics { return 404; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
