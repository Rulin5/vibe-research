groups:
  - name: vibe-research
    rules:
      - alert: VibeApiScrapeDown
        expr: up{job="vibe-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Vibe Research API metrics unavailable"}
      - alert: VibeApiHighErrorRate
        expr: sum(rate(vr_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(vr_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "API 5xx ratio is above 5%"}
      - alert: VibeApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(vr_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "API p95 latency is above 2 seconds"}
      - alert: VibeDependencyNotReady
        expr: vr_dependency_ready == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "A required API dependency is not ready"}
